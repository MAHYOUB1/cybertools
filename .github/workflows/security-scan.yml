name: Security DAST Scan (OWASP ZAP)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  zap_security_scan:
    name: Run App and Scan with ZAP
    runs-on: ubuntu-latest

    steps:
      # 1. نسخ كود المشروع باستخدام الإصدار v4
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. تشغيل الحاويات بالخلفية باستخدام docker compose الحديثة
      - name: Start Application Services
        run: |
          docker compose up -d

      # 3. الانتظار لضمان استقرار الخدمات بالكامل قبل بدء الفحص
      - name: Wait for Services to be Healthy
        run: |
          echo "Waiting for services to boot up..."
          sleep 15

      # 4. تشغيل الفحص الأمني باستخدام أداة ZAP الرسمية مع الإعدادات الآمنة
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'http://localhost:4000'
          artifact_name: 'zap-security-report'
          fail_action: false            # لضمان اكتمال خط الإنتاج بنجاح ورفع التقرير حتى عند وجود ثغرات
          allow_issue_writing: false    # لمنع الأداة من طلب صلاحيات الكتابة والمحافظة على أمان المستودع

      # 5. تنظيف وتدمير الحاويات بعد انتهاء الفحص لحفظ موارد السيرفر السحابي
      - name: Stop and Clean Up Containers
        if: always()
        run: |
          docker compose down -v --rmi local