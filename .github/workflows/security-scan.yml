name: Security DAST Scan (OWASP ZAP)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  zap_security_scan:
    name: Run App and Scan with ZAP
    runs-on: ubuntu-latest

    steps:
      # 1. نسخ كود المشروع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. تشغيل الحاويات بالخلفية
      - name: Start Application Services
        run: |
          docker compose up -d

      # 3. الانتظار لضمان استقرار الخدمات
      - name: Wait for Services to be Healthy
        run: |
          echo "Waiting for services to boot up..."
          sleep 15

      # 4. تشغيل الفحص باستخدام الأداة الرسمية لـ ZAP على جيت هاب
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'http://localhost:4000' # المنفذ الخارجي المعروض للفرونت إند على جهاز المضيف
          artifact_name: 'zap-security-report'

      # 5. تنظيف وتدمير الحاويات بعد انتهاء الفحص
      - name: Stop and Clean Up Containers
        if: always()
        run: |
          docker compose down -v --rmi local