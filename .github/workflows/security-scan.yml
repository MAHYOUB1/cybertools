name: Security DAST Scan (OWASP ZAP)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  zap_security_scan:
    name: Run App and Scan with ZAP
    runs-on: ubuntu-latest

    steps:
      # 1. نسخ كود المشروع باستخدام الإصدار v4
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. تشغيل الحاويات بالخلفية
      - name: Start Application Services
        run: |
          docker compose up -d

      # 3. الانتظار لضمان استقرار الخدمات بالكامل قبل بدء الفحص
      - name: Wait for Services to be Healthy
        run: |
          echo "Waiting for services to boot up..."
          sleep 15

      # 4. تشغيل الفحص الأمني مع إغلاق الرفع التلقائي الخاص بالأداة لتجنب الأخطاء
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'http://localhost:4000'
          fail_action: false            # لضمان عدم إفشال خط الإنتاج
          allow_issue_writing: false    # لمنع أخطاء الصلاحيات
          # لم نضع هنا artifact_name حتى لا تقوم الأداة بالرفع وتفشل

      # 5. رفع التقارير يدوياً باستخدام الأداة الرسمية والمحدثة من GitHub لضمان النجاح
      - name: Upload ZAP Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report    # الاسم هنا مضمون وسيعمل 100%
          path: |
            report_html.html
            report_md.md
            report_json.json

      # 6. تنظيف وتدمير الحاويات بعد انتهاء الفحص
      - name: Stop and Clean Up Containers
        if: always()
        run: |
          docker compose down -v --rmi local