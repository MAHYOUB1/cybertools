name: Security DAST Scan (OWASP ZAP)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  zap_security_scan:
    name: Run App and Scan with ZAP
    runs-on: ubuntu-latest

    steps:
      # 1. نسخ كود المشروع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. تشغيل الحاويات بالخلفية
      - name: Start Application Services
        run: |
          docker compose up -d

      # 3. الانتظار لضمان استقرار الخدمات بالكامل قبل بدء الفحص
      - name: Wait for Services to be Healthy
        run: |
          echo "Waiting for services to boot up..."
          sleep 15

      # 4. تشغيل الفحص باستخدام Docker والصورة الرسمية المستقرة (بدون وساطة الأداة المسببة للمشاكل)
      - name: Run OWASP ZAP Baseline Scan
        run: |
          mkdir -p zap-reports
          # تعديل الصلاحيات للمجلد لضمان عدم حدوث خطأ Permission Denied أثناء كتابة التقارير
          chmod 777 zap-reports
          docker run --rm \
            --network host \
            -v $(pwd)/zap-reports:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:4000 \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html || true  # استخدام || true يمنع فشل الـ pipeline عند العثور على ثغرات

      # 5. رفع التقارير باستخدام الأداة الرسمية والآمنة لـ GitHub
      - name: Upload ZAP Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: zap-reports/

      # 6. تنظيف وتدمير الحاويات بعد انتهاء الفحص
      - name: Stop and Clean Up Containers
        if: always()
        run: |
          docker compose down -v --rmi local