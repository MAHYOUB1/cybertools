ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerAdmin admin@cybertools.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        # منع عرض قائمة الملفات (Directory Listing)
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # منع الوصول المباشر لملفات includes
    <Directory /var/www/html/includes>
        Require all denied
    </Directory>

    # تقييد مجلد uploads - منع تنفيذ PHP
    <Directory /var/www/html/uploads>
        <FilesMatch "\.(php|phtml|php3|php4|php5|phps)$">
            Require all denied
        </FilesMatch>
        Options -ExecCGI
        php_flag engine off
    </Directory>

    # CORS Headers - محددة لمصدر واحد فقط
    Header always set Access-Control-Allow-Origin "http://localhost:4000"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, X-CSRF-Token, X-Request-ID"
    Header always set Access-Control-Allow-Credentials "true"

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    # إخفاء معلومات الخادم
    Header always unset X-Powered-By

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
