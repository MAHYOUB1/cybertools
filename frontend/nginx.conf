# Rate Limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=gateway_limit:10m rate=20r/s;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # إخفاء إصدار Nginx
    server_tokens off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;

    # ضغط الملفات
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # الصفحات الثابتة
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ══════════════════════════════════════════════════════════════
    # API Gateway المشفر - النقطة الرئيسية للطلبات
    # في Network Tab يظهر فقط POST /api/gateway.php
    # ══════════════════════════════════════════════════════════════
    location = /api/gateway.php {
        limit_req zone=gateway_limit burst=10 nodelay;

        proxy_pass http://backend:80/api/gateway.php;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # إخفاء headers الداخلية
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # إعادة توجيه طلبات API المباشرة
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # إخفاء headers الداخلية
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        # CORS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "http://localhost:3000";
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type,X-CSRF-Token,X-Request-ID";
            add_header Access-Control-Allow-Credentials "true";
            add_header Content-Length 0;
            return 204;
        }
    }

    # منع الوصول لملفات includes (حماية إضافية)
    location ~ /includes/ {
        deny all;
        return 404;
    }

    # منع الوصول لملفات مخفية
    location ~ /\. {
        deny all;
        return 404;
    }

    # تخزين مؤقت للأصول
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # صفحة 404 مخصصة
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
