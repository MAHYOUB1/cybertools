<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - CyberTools</title>
<meta name="description" content="تسجيل الدخول إلى منصة CyberTools لأدوات الأمن السيبراني">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<nav class="navbar">
  <a href="/index.html" class="navbar-brand"><span class="logo-icon">🛡️</span> CyberTools</a>
  <ul class="navbar-nav">
    <li><a href="/index.html">الرئيسية</a></li>
    <li><a href="/products.html">المنتجات</a></li>
  </ul>
  <div class="navbar-actions"></div>
</nav>

<main class="main-content" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 30% 50%,rgba(0,255,136,0.05) 0%,transparent 60%),var(--bg-primary)">
  <div style="width:100%;max-width:440px;padding:1rem">

    <div style="text-align:center;margin-bottom:2rem">
      <div style="font-size:3rem;margin-bottom:1rem">🔐</div>
      <h1 style="font-size:1.8rem;margin-bottom:0.4rem">تسجيل الدخول</h1>
      <p style="color:var(--text-secondary);font-size:0.9rem">أدخل بياناتك للوصول لحسابك</p>
    </div>

    <div class="card">
      <div id="alert-box"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">
            <span class="icon icon-sm icon-cyan">person</span> اسم المستخدم
          </label>
          <input type="text" id="username" class="form-control" placeholder="أدخل اسم المستخدم" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label class="form-label">
            <span class="icon icon-sm icon-cyan">lock</span> كلمة المرور
          </label>
          <div style="position:relative">
            <input type="password" id="password" class="form-control" placeholder="أدخل كلمة المرور" autocomplete="current-password" required style="padding-left:2.5rem">
            <button type="button" onclick="togglePassword()" style="position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted)">
              <span class="icon icon-sm" id="pw-toggle-icon">visibility</span>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">
          <span class="icon">login</span> تسجيل الدخول
        </button>
      </form>

      <div style="text-align:center;margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border)">
        <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:0.75rem">
          ليس لديك حساب؟ <a href="/register.html" style="color:var(--accent-green);text-decoration:none;font-weight:600">إنشاء حساب مشتري</a>
        </p>
        <p style="color:var(--text-secondary);font-size:0.9rem">
          تريد فتح متجر؟ <a href="/seller-register.html" style="color:var(--accent-cyan);text-decoration:none;font-weight:600">سجل كبائع</a>
        </p>
      </div>

      <!-- بيانات الاختبار -->
      <div style="margin-top:1.25rem;padding:1rem;background:var(--bg-card2);border-radius:10px;border:1px solid var(--border)">
        <p style="font-size:0.75rem;color:var(--text-muted);margin-bottom:0.75rem;display:flex;align-items:center;gap:0.3rem">
          <span class="icon icon-sm">info</span> بيانات اختبار:
        </p>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem">
          <button onclick="fillLogin('admin','admin123')" class="btn btn-sm" style="background:rgba(124,58,237,0.1);border:1px solid rgba(124,58,237,0.3);color:#a78bfa;font-size:0.75rem">
            <span class="icon icon-sm">admin_panel_settings</span> Admin
          </button>
          <button onclick="fillLogin('seller1','seller123')" class="btn btn-sm" style="background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.3);color:var(--accent-cyan);font-size:0.75rem">
            <span class="icon icon-sm">storefront</span> Seller
          </button>
          <button onclick="fillLogin('customer1','pass123')" class="btn btn-sm" style="background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.3);color:var(--accent-green);font-size:0.75rem">
            <span class="icon icon-sm">person</span> Customer
          </button>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="/assets/js/crypto.js"></script>
<script src="/assets/js/crypto.js"></script><script src="/assets/js/main.js"></script>
<script>
// إعادة توجيه إذا كان مسجلاً مسبقاً
if (Auth.isLoggedIn()) window.location.href = '/index.html';

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.innerHTML = '<span class="icon">hourglass_empty</span> جارٍ التحقق...';

  try {
    const res = await api('/auth.php?action=login', {
      method: 'POST',
      body: JSON.stringify({ username, password }),
    });
    Auth.setUser(res.user);
    if (res.csrf_token) Auth.setCSRF(res.csrf_token);
    showToast(`مرحباً ${DOMPurify.sanitize(res.user.name || res.user.username)}!`, 'success');
    setTimeout(() => {
      // التحقق من أمان redirect URL
      const params = new URLSearchParams(window.location.search);
      let redirect = params.get('redirect') || '/index.html';
      // منع Open Redirect - السماح فقط بالمسارات المحلية
      if (!redirect.startsWith('/') || redirect.startsWith('//')) redirect = '/index.html';
      window.location.href = redirect;
    }, 800);
  } catch (err) {
    showAlert(err.message || 'بيانات الدخول غير صحيحة', 'error');
    btn.disabled = false;
    btn.innerHTML = '<span class="icon">login</span> تسجيل الدخول';
  }
}

function showAlert(msg, type = 'error') {
  const box = document.getElementById('alert-box');
  const safeMsg = DOMPurify.sanitize(msg);
  box.innerHTML = `<div class="alert alert-${type}" style="margin-bottom:1rem"><span class="icon icon-sm">${type==='error'?'error':'info'}</span> ${safeMsg}</div>`;
}

function fillLogin(u, p) {
  document.getElementById('username').value = u;
  document.getElementById('password').value = p;
}

function togglePassword() {
  const pw = document.getElementById('password');
  const ic = document.getElementById('pw-toggle-icon');
  if (pw.type === 'password') { pw.type = 'text'; ic.textContent = 'visibility_off'; }
  else { pw.type = 'password'; ic.textContent = 'visibility'; }
}
</script>
</body>
</html>
